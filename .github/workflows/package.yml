name: Build Python package

on:
  push:
    branches:
      - main
      - development
    paths:
      - pyproject.toml
      - uv.lock
      - MANIFEST.in
      - src/**
      - README.md
      - LICENSE
      - .github/workflows/package.yml
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - MANIFEST.in
      - src/**
      - README.md
      - LICENSE
      - .github/workflows/package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12.16"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev python -m build --no-isolation
      - run: uv run --locked --extra dev python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/

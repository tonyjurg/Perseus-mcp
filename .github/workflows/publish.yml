name: Publish to PyPI

on:
  # Publishing is an explicit manual action, independent of tags and releases.
  workflow_dispatch:

jobs:
  dependency-security:
    uses: ./.github/workflows/dependency-audit.yml

  build-and-publish:
    needs: dependency-security
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    env:
      UV_PYTHON: "3.12.16"

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          ref = os.environ["GITHUB_REF"]
          if not ref.startswith("refs/tags/v"):
              raise SystemExit(
                  "PyPI publishing must run from a v* tag, "
                  f"not {ref!r}."
              )
          version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version "
                  f"{version!r}; expected {expected_tag!r}."
              )
          print(f"Verified package version {version} against tag {tag}.")
          PY

      - name: Install build dependencies
        run: uv sync --locked --extra dev

      - name: Build package
        run: uv run --locked --extra dev python -m build --no-isolation

      - name: Validate package metadata
        run: uv run --locked --extra dev python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

name: Lint

on:
  push:
    branches:
      - main
      - development
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - .github/workflows/lint.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - .github/workflows/lint.yml

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests

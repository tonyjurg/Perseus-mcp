name: Lint

on:
  push:
    branches:
      - main
      - development
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - scripts/**
      - .github/workflows/lint.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - scripts/**
      - .github/workflows/lint.yml

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.18"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev python -m ruff check src tests scripts
      - run: uv run --locked --extra dev python -m ruff format --check src tests scripts

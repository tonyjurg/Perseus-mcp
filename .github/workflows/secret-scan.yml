name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  openrouter-key-scan:
    name: Block OpenRouter API keys
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked files for OpenRouter API keys
        shell: bash
        run: |
          set -euo pipefail

          pattern='sk-or-v1-[A-Za-z0-9_-]{20,}'
          matches="$(git grep -I -l -E "${pattern}" -- . || true)"

          if [[ -n "${matches}" ]]; then
            echo "OpenRouter API key pattern detected in tracked repository files."
            echo "Remove the key, rotate it in OpenRouter, and commit the cleaned file."
            echo "Files with matches:"
            echo "${matches}"
            exit 1
          fi

          echo "No OpenRouter API key pattern detected."

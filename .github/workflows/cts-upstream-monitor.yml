name: Live CTS format monitor

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cts-upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check live CTS envelopes (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.18"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked
      - name: Compare live roots and namespaces with captured sources
        run: uv run --locked python scripts/check_cts_upstream.py

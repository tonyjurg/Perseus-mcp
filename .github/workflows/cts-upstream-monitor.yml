name: Live CTS format monitor

on:
  schedule:
    # Cron cannot express "first Monday" directly; gate other Mondays below.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cts-upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check live CTS envelopes (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select the first Monday or a manual run
        id: schedule
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$(date -u +%d)" < "08" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.schedule.outputs.run == 'true'
      - uses: actions/setup-python@v7
        if: steps.schedule.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
        if: steps.schedule.outputs.run == 'true'
      - name: Compare live roots and namespaces with captured sources
        if: steps.schedule.outputs.run == 'true'
        run: python scripts/check_cts_upstream.py

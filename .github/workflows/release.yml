name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-security:
    uses: ./.github/workflows/dependency-audit.yml

  release:
    needs: dependency-security
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12.16"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version "
                  f"{version!r}; expected {expected_tag!r}."
              )
          print(f"Verified package version {version} against tag {tag}.")
          PY

      - name: Install build tooling
        run: uv sync --locked --extra dev

      - name: Build distributions
        run: uv run --locked --extra dev python -m build --no-isolation

      - name: Validate package metadata
        run: uv run --locked --extra dev python -m twine check dist/*

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: dist/*
          generate_release_notes: true

name: Build API documentation

on:
  pull_request:
    paths:
      - src/**
      - docs/api/**
      - pyproject.toml
      - uv.lock
      - scripts/build_api_docs.py
      - .github/workflows/api-docs.yml
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.18"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --extra docs
      - run: uv run --locked --extra docs python scripts/build_api_docs.py --output .cache/api-docs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read package version
        id: version
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
      - uses: actions/upload-artifact@v7
        with:
          name: api-docs-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: .cache/api-docs/


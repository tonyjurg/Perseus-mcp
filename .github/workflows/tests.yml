name: Tests

on:
  push:
    branches:
      - main
      - development
    paths-ignore:
      - docs/**
  pull_request:
    paths-ignore:
      - docs/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11.18", "3.12.16", "3.13.18"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - run: uv run --locked --extra dev --python ${{ matrix.python-version }} python -m pytest

  dependency-range:
    name: Test dependency range (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [lowest-direct, highest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.18"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - run: uv venv .venv
      - run: uv pip install --resolution ${{ matrix.resolution }} -e ".[dev,security]"
      - run: uv run --no-sync python -m pytest
      - run: |
          mkdir -p .cache/audit
          uv pip freeze --exclude-editable > .cache/audit/installed.txt
          uv run --no-sync python -m pip_audit -r .cache/audit/installed.txt --no-deps --disable-pip --strict --vulnerability-service osv
      - run: uv run --no-sync python scripts/check_fastmcp_advisories.py
        env:
          GH_TOKEN: ${{ github.token }}

name: Publish Docs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    tags: ["*"]
    paths:
      - docs/**
      - src/**
      - pyproject.toml
      - scripts/build_api_docs.py
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - src/**
      - pyproject.toml
      - scripts/build_api_docs.py
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A release/tag event must not replace Current with the tagged code.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Prepare writable combined site
        # The Jekyll container owns _site; copy its contents as the runner user.
        run: |
          mkdir -p .cache/pages-site
          cp -R _site/. .cache/pages-site/

      - name: Set up Python for API documentation
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build Sphinx API reference
        run: python scripts/build_api_docs.py --output .cache/pages-site/api

      - name: Verify combined site
        run: |
          test -s .cache/pages-site/index.html
          test -s .cache/pages-site/api/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.cache/pages-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Publish Docs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - docs/**
      - src/**
      - pyproject.toml
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - src/**
      - pyproject.toml
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Prepare writable combined site
        # The Jekyll container owns _site; copy its contents as the runner user.
        run: |
          mkdir -p .cache/pages-site
          cp -R _site/. .cache/pages-site/

      - name: Set up Python for API documentation
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build Sphinx API reference
        run: python -m sphinx -W --keep-going -b html docs/api .cache/pages-site/api

      - name: Verify combined site
        run: |
          test -s .cache/pages-site/index.html
          test -s .cache/pages-site/api/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.cache/pages-site

  deploy:
    if: github.event_name == 'push'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

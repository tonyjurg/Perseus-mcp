version: 2

updates:
  # Refresh the complete portable dependency graph, not only manifest bounds.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-lock:
        patterns: ["*"]

  # Action versions used by workflows under .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

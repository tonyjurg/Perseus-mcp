[project]
name = "perseus-mcp"
version = "0.1.0"
description = "MCP server for Perseus Greek and Latin text research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.12.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/tonyjurg/Perseus-mcp"
Repository = "https://github.com/tonyjurg/Perseus-mcp"
Issues = "https://github.com/tonyjurg/Perseus-mcp/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

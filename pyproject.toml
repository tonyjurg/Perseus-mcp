[project]
name = "perseus-mcp"
version = "1.1.0"
description = "MCP server for Perseus Greek and Latin text research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Tony Jurg" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "perseus",
  "classics",
  "ancient-greek",
  "latin",
  "cts",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "defusedxml>=0.7.1",
  "fastmcp>=4.2.3,<5",
  "httpx>=0.27.0",
  "platformdirs>=4.0.0",
  # Security floors also constrain already-installed transitive dependencies.
  "anyio>=4.14.2",
  "certifi>=2026.10.19",
  "cryptography>=50.0.0",
  "dnspython>=2.9.2",
  "pydantic-settings>=2.14.2",
  "PyJWT>=2.15.0",
]

[project.optional-dependencies]
docs = [
  "sphinx>=8.2,<10",
  "sphinx-rtd-theme>=3,<4",
]
dev = [
  "build>=1.2",
  "pip>=26.2.2",
  "pytest>=9.0.3",
  "ruff>=0.16.2,<0.18",
  "setuptools>=84.1.0",
  "twine>=6.0",
  "wheel>=0.46.2",
]
security = [
  "packaging>=24",
  "pip-audit>=2.10.1",
]

[tool.uv]
required-version = ">=0.13.9"

[project.urls]
Homepage = "https://github.com/tonyjurg/Perseus-mcp"
Documentation = "https://tonyjurg.github.io/Perseus-mcp/"
Repository = "https://github.com/tonyjurg/Perseus-mcp"
Issues = "https://github.com/tonyjurg/Perseus-mcp/issues"

[project.scripts]
perseus-mcp = "perseus_mcp.server:main"

[build-system]
requires = ["setuptools>=84.1.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

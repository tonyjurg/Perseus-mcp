[project]
name = "perseus-mcp"
version = "1.0.1"
description = "MCP server for Perseus Greek and Latin text research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Tony Jurg" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "perseus",
  "classics",
  "ancient-greek",
  "latin",
  "cts",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "defusedxml>=0.7.1",
  "fastmcp>=2.12.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/tonyjurg/Perseus-mcp"
Documentation = "https://tonyjurg.github.io/Perseus-mcp/"
Repository = "https://github.com/tonyjurg/Perseus-mcp"
Issues = "https://github.com/tonyjurg/Perseus-mcp/issues"

[project.scripts]
perseus-mcp = "perseus_mcp.server:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

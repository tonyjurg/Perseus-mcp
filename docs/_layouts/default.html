<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="alternate" type="text/plain" href="{{ '/llms.txt' | relative_url }}" title="Perseus MCP documentation for LLMs">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-title" href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/img/perseus-mcp-logo.png' | relative_url }}" alt="" class="site-logo">
          <span>Perseus MCP</span>
        </a>
        <div class="nav-links">
          <a href="{{ '/enduser/' | relative_url }}">End-User Guide</a>
          <a href="{{ '/architecture/' | relative_url }}">Architecture</a>
          <a href="{{ '/notebooks/' | relative_url }}">Notebooks</a>
          <a href="{{ '/contributing/' | relative_url }}">Contributing</a>
          <a href="{{ '/license/' | relative_url }}">License</a>
          <a href="{{ site.github_url }}">GitHub</a>
        </div>
      </nav>
    </header>

    <main class="page">
      {{ content }}
    </main>
  </body>
</html>
